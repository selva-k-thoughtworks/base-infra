name: Snowflake Integration
on: [push]

permissions:
  id-token: write
  contents: read

jobs:
  snowflake-job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Debug Token Claims
        id: get-token
        run: |
          TOKEN=$(curl -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://github.com/selva-k-thoughtworks" | jq -r '.value')
          
          # Decode token to see claims (base64 decode the payload)
          echo "Token payload:"
          echo $TOKEN | cut -d'.' -f2 | base64 -d 2>/dev/null | jq .
          
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> $GITHUB_OUTPUT
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      
      - name: Install Snowflake Connector
        run: pip install snowflake-connector-python
      
      - name: Connect to Snowflake
        env:
          SNOWFLAKE_ACCOUNT: 'xp05524.eu-west-3.aws'
          SNOWFLAKE_TOKEN: ${{ steps.get-token.outputs.token }}
        run: |
          python << EOF
          import snowflake.connector
          
          conn = snowflake.connector.connect(
              account='xp05524.eu-west-3.aws',
              token=os.environ['SNOWFLAKE_TOKEN'],
              authenticator='oauth',
              warehouse='COMPUTE_WH',
              database='SNOWFLAKE'
          )
          
          cursor = conn.cursor()
          cursor.execute("USE ROLE GITHUB_OIDC_SPIKE_ROLE")
          cursor.execute("SELECT CURRENT_USER(), CURRENT_ROLE()")
          print(cursor.fetchone())
          cursor.close()
          conn.close()
          EOF
