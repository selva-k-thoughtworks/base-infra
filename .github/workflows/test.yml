name: Snowflake Integration
on: [push]

permissions:
  id-token: write
  contents: read

jobs:
  snowflake-job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Get GitHub OIDC Token
        id: get-token
        run: |
          TOKEN=$(curl -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://github.com/selva-k-thoughtworks" | jq -r '.value')
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> $GITHUB_OUTPUT
      
      - name: Install SnowSQL
        run: |
          curl -O https://sfc-repo.snowflakecomputing.com/snowsql/bootstrap/1.2/linux_x86_64/snowsql-1.2.28-linux_x86_64.bash
          bash snowsql-1.2.28-linux_x86_64.bash
      
      - name: Connect to Snowflake
        env:
          SNOWFLAKE_ACCOUNT: 'xp05524.eu-west-3.aws'
          SNOWFLAKE_TOKEN: ${{ steps.get-token.outputs.token }}
        run: |
          snowsql -a xp05524.eu-west-3.aws \
                  --authenticator=oauth \
                  --token=$SNOWFLAKE_TOKEN \
                  -w COMPUTE_WH \
                  -q "SELECT CURRENT_USER(), CURRENT_ROLE();"
